[project]
name = "breast-cancer-detection-backend"
version = "1.0.0"
description = "FastAPI backend for Breast Cancer Detection using VGG19"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "pillow>=11.0.0",
    "numpy>=1.26.4,<2.3",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "scikit-learn>=1.5.2",
    "matplotlib>=3.9.2",
    "reportlab>=4.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[tool.uv]
package = false
